<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LinkClaro Admin</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div id="login-screen" class="login-screen hidden">
    <form id="login-form" class="login-card">
      <h1>LinkClaro <span>Admin</span></h1>
      <p>Controle de números, cartões, recargas e logs</p>
      <label class="sr-only" for="login-password">Senha</label>
      <input type="password" id="login-password" placeholder="Senha admin" autocomplete="current-password" required>
      <button type="submit" class="btn block">Entrar</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>

  <div id="app" class="app hidden">
    <div id="sidebar-overlay" class="sidebar-overlay" hidden></div>
    <aside id="sidebar" class="sidebar">
      <div class="brand">LinkClaro<span>Admin</span></div>
      <nav id="main-nav">
        <a href="/" data-route="/" class="nav-link active">Dashboard</a>
        <a href="/numeros" data-route="/numeros" class="nav-link">Números</a>
        <a href="/cartoes" data-route="/cartoes" class="nav-link">Cartões</a>
        <a href="/recargas" data-route="/recargas" class="nav-link">Recargas</a>
        <a href="/usuarios" data-route="/usuarios" class="nav-link">Usuários</a>
        <a href="/sessoes" data-route="/sessoes" class="nav-link">Sessões Edge</a>
        <a href="/logs" data-route="/logs" class="nav-link">Logs</a>
        <a href="/config" data-route="/config" class="nav-link">Configuração</a>
        <a href="/sistema" data-route="/sistema" class="nav-link">Sistema</a>
      </nav>
      <button type="button" id="logout-btn" class="logout">Sair</button>
    </aside>

    <div class="shell">
      <header class="topbar">
        <button type="button" id="menu-btn" class="icon-btn" aria-label="Abrir menu">☰</button>
        <h2 id="view-title">Dashboard</h2>
        <div class="topbar-actions">
          <button type="button" id="refresh-btn" class="btn secondary">Atualizar</button>
          <span id="status-dot" class="status-dot" title="Status da API"></span>
        </div>
      </header>
      <section id="content" class="content"></section>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="/assets/app.js?v=aprovados"></script>
</body>
</html>
